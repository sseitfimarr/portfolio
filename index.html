<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <title>Ssei Galleries</title>
</head>
<body>
    <div class="hand-phone-only">
        <img src="assets/images/cat.png" alt="">
        <h1>Sorry, this site is still under development</h1>
        <p>You can only access this site via a mobile device</p>
    </div>
    <div class="container">
        <header class="header">
            <div class="profile">
                <div class="photo-profile"></div>
                <div class="username">
                    <h1>Rafick Miftawan</h1>
                    <p>sseitfimarr</p>
                </div>
            </div>
        </header>
        <div class="line"></div>
        <section class="bio">
            <h1>do<br>
            whatever<br>
            you want</h1>
        </section>
        <div class="whats-new">
            <h1>Whats new?</h1>
            <div class="new-design">
                <div class="bone-async"></div>
            </div>
            <div class="description"></div>
        </div>
        <div class="line"></div>
        <h1 class="title">Author Galleries</h1>
        <div class="categories">
            <div class="headline">
                <h1>Poster Design</h1>
                <section class="see-more">
                    <p class="type">See more</p>
                    <i class="fa-solid fa-chevron-down"></i>
                </section>
            </div>
            <div class="design" id="feed-design">
                <div class="bone-async"></div>
                <div class="bone-async"></div>
                <div class="bone-async"></div>
            </div>
        </div>
    </div>
    <script src="main.js?v=2"></script>

</html>
